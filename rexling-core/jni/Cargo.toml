[package]
name = "rexling-jni"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[lib]
name = "rex_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
jni = { version = "0.21.1", default-features = false }
rex-core = { package = "rexling-core", path = ".." }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync"] }

[dev-dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.29"
